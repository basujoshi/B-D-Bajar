<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders - B.D.Bajar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-blue-600 text-white py-4 shadow-md">
    <h1 class="text-2xl font-bold text-center">📦 My Orders - B.D.Bajar</h1>
  </header>

  <!-- Input Phone -->
  <div class="max-w-md mx-auto mt-8 px-4">
    <input type="text" id="phoneInput" placeholder="Enter your phone number"
      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
    <button onclick="fetchMyOrders()" 
      class="mt-4 w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
      Show My Orders
    </button>
  </div>

  <!-- Orders Cards -->
  <div id="ordersContainer" class="max-w-4xl mx-auto mt-8 grid gap-6 px-4 md:grid-cols-2 lg:grid-cols-3"></div>

  <!-- Cancel Modal -->
  <div id="cancelModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h2 class="text-lg font-bold mb-4">Cancel Order</h2>
      <label class="block mb-2">Select Reason:</label>
      <select id="cancelReason" class="w-full border rounded p-2 mb-4">
        <option value="Size Issue">Size Issue</option>
        <option value="Mistake in Order">Mistake in Order</option>
        <option value="Damage Product">Damage Product</option>
        <option value="Late Delivery">Late Delivery</option>
        <option value="Order Mistake">Order Mistake</option>
      </select>
      <div class="flex justify-end gap-3">
        <button onclick="closeCancelModal()" class="px-4 py-2 bg-gray-300 rounded">Close</button>
        <button onclick="confirmCancel()" class="px-4 py-2 bg-red-600 text-white rounded">Confirm Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Firebase Config =====
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "order-save-66986.firebaseapp.com",
      databaseURL: "https://order-save-66986-default-rtdb.firebaseio.com",
      projectId: "order-save-66986",
      storageBucket: "order-save-66986.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentCancelOrderId = null;

    function getStatusColor(status) {
      switch ((status || "").toLowerCase()) {
        case "delivered": return "bg-green-100 text-green-700";
        case "cancelled": return "bg-red-100 text-red-700";
        case "confirmed": return "bg-blue-100 text-blue-700";
        default: return "bg-yellow-100 text-yellow-700";
      }
    }

    function fetchMyOrders() {
      const phone = document.getElementById("phoneInput").value.trim();
      const container = document.getElementById("ordersContainer");
      container.innerHTML = "";

      if (!phone) {
        alert("Please enter your phone number");
        return;
      }

      db.ref("orders").orderByChild("customer/phone").equalTo(phone).on("value", snapshot => {
        container.innerHTML = "";
        if (!snapshot.exists()) {
          container.innerHTML = `<p class="text-center text-gray-600 col-span-full">No orders found.</p>`;
          return;
        }

        snapshot.forEach(orderSnap => {
          const order = orderSnap.val();
          const status = order.status || "Pending";
          const statusClass = getStatusColor(status);

          let itemsHtml = "";
          if (order.items) {
            order.items.forEach(it => {
              itemsHtml += `
                <div class="flex items-center gap-2 mb-1">
                  <img src="${it.img || ''}" class="w-12 h-12 object-cover rounded" alt="${it.name}">
                  <div class="text-left">
                    <div class="font-semibold">${it.qty} × ${it.name}</div>
                    <div class="text-sm text-gray-600">Size: ${it.size}</div>
                  </div>
                </div>
              `;
            });
          }

          const card = document.createElement("div");
          card.className = "bg-white shadow-lg rounded-lg p-5 border relative";
          card.innerHTML = `
            <h2 class="text-lg font-bold mb-2 truncate">Order ID: ${orderSnap.key}</h2>
            <div class="text-sm text-gray-700 mb-2"><b>Name:</b> ${order.customer.name || ""}</div>
            <div class="text-sm text-gray-700 mb-2"><b>Phone:</b> ${order.customer.phone || ""}</div>
            <div class="mb-2">${itemsHtml}</div>
            <span class="inline-block px-3 py-1 mt-2 text-sm font-semibold rounded-full ${statusClass}">
              ${status}
            </span>
            <div class="mt-3 text-sm"><b>Delivery Address:</b><br>${order.customer.address || ""}</div>
          `;

          if (status.toLowerCase() !== "cancelled" && status.toLowerCase() !== "delivered") {
            const cancelBtn = document.createElement("button");
            cancelBtn.className = "absolute top-3 right-3 bg-red-500 text-white px-3 py-1 rounded";
            cancelBtn.textContent = "Cancel";
            cancelBtn.onclick = () => openCancelModal(orderSnap.key);
            card.appendChild(cancelBtn);
          }

          container.appendChild(card);
        });
      });
    }

    function openCancelModal(orderId) {
      currentCancelOrderId = orderId;
      document.getElementById("cancelModal").classList.remove("hidden");
      document.getElementById("cancelModal").classList.add("flex");
    }

    function closeCancelModal() {
      currentCancelOrderId = null;
      document.getElementById("cancelModal").classList.add("hidden");
      document.getElementById("cancelModal").classList.remove("flex");
    }

    function confirmCancel() {
      const reason = document.getElementById("cancelReason").value;
      if (!currentCancelOrderId) return;

      db.ref("orders/" + currentCancelOrderId).update({
        status: "Cancelled",
        cancelReason: reason
      }, (error) => {
        if (error) {
          alert("❌ Failed to cancel order");
        } else {
          alert("✅ Order cancelled");
          closeCancelModal();
        }
      });
    }
  </script>
</body>
</html>
