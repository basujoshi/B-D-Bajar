<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout</title>

<style>
body{
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}

#logoutBtn{
    background:#dc2626;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
}

#logoutBtn:hover{
    background:#b91c1c;
}
</style>
</head>
<body>

<button id="logoutBtn">🚪 Logout</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBZtoHvLhv7unvgbzd_gHppsFH7H3za8gQ",
    authDomain: "order-tracking-d18f5.firebaseapp.com",
    databaseURL: "https://order-tracking-d18f5-default-rtdb.firebaseio.com",
    projectId: "order-tracking-d18f5",
    storageBucket: "order-tracking-d18f5.firebasestorage.app",
    messagingSenderId: "165667356277",
    appId: "1:165667356277:web:a912f44aa91fe4479d423c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("logoutBtn").addEventListener("click", async () => {
    try{
        await signOut(auth);
        alert("Logout Successful");
        window.location.href = "Index.html";
    }catch(error){
        alert("Logout Error: " + error.message);
    }
});
</script>

</body>
</html>
