<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.D.BAJAR - Admin Panel</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  h2 { text-align: center; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
  th { background: #007bff; color: white; }
  button { padding: 5px 10px; cursor: pointer; margin-right: 5px; }
  .success { background: #28a745; color: white; border: none; }
  .cancel { background: #dc3545; color: white; border: none; }
  .exchange { background: #ffc107; color: black; border: none; }
</style>
</head>
<body>

<h2>📦 B.D.BAJAR Admin Panel</h2>

<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Customer</th>
      <th>Reason</th>
      <th>Type</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="returnList"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getDatabase, ref, onChildAdded, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

const firebaseConfig = { databaseURL: "https://king-59c08-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const returnsRef = ref(db, "returns");

const list = document.getElementById("returnList");

onChildAdded(returnsRef, (data) => {
  const req = data.val();
  const key = data.key;

  const row = document.createElement("tr");
  row.innerHTML = `
    <td>${req.orderId}</td>
    <td>${req.name} <br> ${req.phone}</td>
    <td>${req.reason}</td>
    <td>${req.type || 'Return'}</td>
    <td id="status_${key}">${req.status}</td>
    <td>
      <button class="success" onclick="markStatus('${key}','Return Successfully ✅')">Return ✅</button>
      <button class="exchange" onclick="markStatus('${key}','Exchange Requested ⚡')">Exchange ⚡</button>
      <button class="cancel" onclick="markStatus('${key}','Cancelled ❌')">Cancel ❌</button>
    </td>
  `;
  list.appendChild(row);
});

window.markStatus = function(key, newStatus) {
  update(ref(db, "returns/" + key), { status: newStatus });
  document.getElementById("status_" + key).innerText = newStatus;
  alert("Status updated: " + newStatus);
};
</script>
</body>
</html>
