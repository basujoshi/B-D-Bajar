
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Sidebar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Menu icon */
        .menu-icon {
            width: 40px;
            cursor: pointer;
            margin: 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }

        .bar {
            width: 80%;
            height: 4px;
            background-color: black;
            margin: 5px 0;
            transition: 0.4s;
        }

        /* Sidebar */
        .sidebar {
            height: 80%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            color: white;
            z-index: 1000;
            border: 1px solid white;
        }

        .sidebar a {
            padding: 10px 20px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<!-- Menu Icon -->
<div class="menu-icon" onclick="toggleMenu()">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- Sidebar Menu -->
<div id="sidebar" class="sidebar">
    <h2 style="padding-left: 20px;"> B.D.Joshi online shopping </h2>
    <nav>
        <ul style="list-style-type: none; padding: 0;">
         <li><a href="my shop.html"> back to B.D.Bajar </a></li>
        
        </ul>
    </nav>
</div>

<script>
    function toggleMenu() {
        var sidebar = document.getElementById("sidebar");
        var overlay = document.getElementById("overlay");

        if (sidebar.style.width === "250px") {
            sidebar.style.width = "0";
            overlay.style.display = "none";
        } else {
            sidebar.style.width = "250px";
            overlay.style.display = "block";
        }
    }

    function closeMenu() {
        document.getElementById("sidebar").style.width = "0";
        document.getElementById("overlay").style.display = "none";
    }
</script>

</body>
</html>


   

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Animated Phone Call Logos with Names Below</title>
  <style>
    /* General Page Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #f6d365, #fda085);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
    }

    /* Calling Logo Styles */
    .calling-logo {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      animation: wiggle 1.5s infinite ease-in-out;
      cursor: pointer;
      transition: transform 0.3s ease;
      flex-direction: column;
    }

    .calling-logo:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .calling-logo img {
      width: 50px;
      height: 50px;
    }

    .ring {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 3px dashed rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: rotate 2s linear infinite;
    }

    /* Wiggle Animation */
    @keyframes wiggle {
      0%, 100% {
        transform: rotate(-5deg);
      }
      50% {
        transform: rotate(5deg);
      }
    }

    /* Rotate Animation for Outer Ring */
    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Name Styles */
    .name {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: color 0.3s ease;
    }

    .name:hover {
      color: #f39c12;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- First Calling Logo with Nepal Name Below -->
    <a href="tel:+9779812710161" class="calling-logo">
      <div class="ring"></div>
      <img src="https://cdn-icons-png.flaticon.com/512/597/597177.png" alt="Call">
      <div class="name">Nepal</div>
    </a>

    <!-- Second Calling Logo with India Name Below -->
    <a href="tel:+919514499562" class="calling-logo">
      <div class="ring"></div>
      <img src="https://cdn-icons-png.flaticon.com/512/597/597177.png" alt="Call">
      <div class="name">India</div>
    </a>
  </div>
</body>
</html>
