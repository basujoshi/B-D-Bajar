<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> B.D.Bajar costomer profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-blue-600 text-white py-4 shadow-md">
    <h1 class="text-2xl font-bold text-center">👤 Customer Profile - B.D.Bajar</h1>
  </header>

  <main class="max-w-3xl mx-auto p-4 mt-6">
    <div class="bg-white rounded shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Save Customer Details</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input id="firstName" placeholder="First Name" class="border p-2 rounded" autocomplete="given-name">
        <input id="lastName" placeholder="Last Name" class="border p-2 rounded" autocomplete="family-name">
        <input id="contact" placeholder="Phone Number" class="border p-2 rounded" autocomplete="tel">
        <input id="gmail" placeholder="Gmail / Email" class="border p-2 rounded" autocomplete="email">
        <input id="address" placeholder="Address" class="border p-2 rounded sm:col-span-2" autocomplete="street-address">
      </div>

      <div class="mt-4 flex flex-wrap gap-2">
        <button id="saveBtn" class="bg-green-600 text-white px-4 py-2 rounded">Save Profile</button>
        <button id="migrateBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Save to Firebase</button>
        <button id="clearBtn" class="bg-gray-200 px-4 py-2 rounded">Clear Profile</button>
        <a href="my Shop.html" class="bg-black text-white px-4 py-2 rounded inline-block">Go to Shop</a>
      </div>

      <p id="msg" class="mt-4 text-green-600 hidden">Profile saved successfully!</p>
      <p id="fbMsg" class="mt-2 text-blue-600 hidden">Profile saved to Firebase!</p>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "order-save-66986.firebaseapp.com",
      databaseURL: "https://order-save-66986-default-rtdb.firebaseio.com",
      projectId: "order-save-66986",
      storageBucket: "order-save-66986.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const firstName = document.getElementById("firstName");
    const lastName = document.getElementById("lastName");
    const contact = document.getElementById("contact");
    const gmail = document.getElementById("gmail");
    const address = document.getElementById("address");
    const msg = document.getElementById("msg");
    const fbMsg = document.getElementById("fbMsg");

    function safeJSON(key) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : null;
      } catch {
        return null;
      }
    }

    function buildProfile() {
      return {
        firstName: firstName.value.trim(),
        lastName: lastName.value.trim(),
        contact: contact.value.trim(),
        gmail: gmail.value.trim(),
        email: gmail.value.trim(),
        address: address.value.trim()
      };
    }

    function saveProfile() {
      const profile = buildProfile();
      localStorage.setItem("profile", JSON.stringify(profile));
      msg.classList.remove("hidden");
      fbMsg.classList.add("hidden");
      setTimeout(() => msg.classList.add("hidden"), 2000);
    }

    async function migrateToFirebase() {
      const profile = buildProfile();
      if (!profile.contact) {
        alert("Phone number required for Firebase save");
        return;
      }

      try {
        await db.ref("customers/" + profile.contact).set({
          ...profile,
          updatedAt: new Date().toISOString()
        });
        localStorage.setItem("profile", JSON.stringify(profile));
        fbMsg.classList.remove("hidden");
        msg.classList.add("hidden");
        setTimeout(() => fbMsg.classList.add("hidden"), 2000);
      } catch (err) {
        alert("Firebase save failed: " + err.message);
      }
    }

    function loadProfile() {
      const savedProfile = safeJSON("profile");
      if (!savedProfile) return;
      firstName.value = savedProfile.firstName || "";
      lastName.value = savedProfile.lastName || "";
      contact.value = savedProfile.contact || "";
      gmail.value = savedProfile.gmail || savedProfile.email || "";
      address.value = savedProfile.address || "";
    }

    function clearProfile() {
      localStorage.removeItem("profile");
      firstName.value = "";
      lastName.value = "";
      contact.value = "";
      gmail.value = "";
      address.value = "";
      alert("Profile cleared");
    }

    document.getElementById("saveBtn").addEventListener("click", saveProfile);
    document.getElementById("migrateBtn").addEventListener("click", migrateToFirebase);
    document.getElementById("clearBtn").addEventListener("click", clearProfile);

    window.addEventListener("DOMContentLoaded", loadProfile);
  </script>
</body>
</html>
