<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.D.Bajar return status check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Menu icon */
        .menu-icon {
            width: 40px;
            cursor: pointer;
            margin: 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }

        .bar {
            width: 80%;
            height: 4px;
            background-color: black;
            margin: 5px 0;
            transition: 0.4s;
        }

        /* Sidebar */
        .sidebar {
            height: 80%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            color: white;
            z-index: 1000;
            border: 1px solid white;
        }

        .sidebar a {
            padding: 10px 20px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<!-- Menu Icon -->
<div class="menu-icon" onclick="toggleMenu()">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- Sidebar Menu -->
<div id="sidebar" class="sidebar">
    <h2 style="padding-left: 20px;"> B.D.Joshi online shopping </h2>
    <nav>
        <ul style="list-style-type: none; padding: 0;">
         <li><a href="my shop.html"> back to B.D.Bajar </a></li>
          <li><a href="B.D.Bajar returns items.html ">  return and exchange</a></li>
          
        </ul>
    </nav>
</div>

<script>
    function toggleMenu() {
        var sidebar = document.getElementById("sidebar");
        var overlay = document.getElementById("overlay");

        if (sidebar.style.width === "250px") {
            sidebar.style.width = "0";
            overlay.style.display = "none";
        } else {
            sidebar.style.width = "250px";
            overlay.style.display = "block";
        }
    }

    function closeMenu() {
        document.getElementById("sidebar").style.width = "0";
        document.getElementById("overlay").style.display = "none";
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B.D.BAJAR - My Return</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div class="max-w-7xl mx-auto bg-white rounded shadow p-4">
  <h1 class="text-2xl font-bold text-center mb-4">📦 My Return Status</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
    <input id="phoneInput" class="border p-2 rounded" placeholder="Enter mobile number">
    <input id="orderIdInput" class="border p-2 rounded" placeholder="Order ID (optional)">
    <button onclick="searchMyReturns()" class="bg-blue-600 text-white px-4 py-2 rounded">Search</button>
  </div>

  <div class="mb-4">
    <label class="block font-semibold mb-1">Filter Status</label>
    <select id="statusFilter" class="border p-2 rounded w-full md:w-64" onchange="searchMyReturns()">
      <option value="">All</option>
      <option value="Pending">Pending</option>
      <option value="Accepted">Accepted</option>
      <option value="Cancelled">Cancelled</option>
      <option value="Rejected">Rejected</option>
    </select>
  </div>

  <div id="returnList" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "order-save-66986.firebaseapp.com",
  databaseURL: "https://order-save-66986-default-rtdb.firebaseio.com",
  projectId: "order-save-66986",
  storageBucket: "order-save-66986.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function mapsLink(address) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address || "");
}

function badge(status) {
  const s = (status || "Pending").toLowerCase();
  if (s === "accepted") return "bg-green-100 text-green-700";
  if (s === "cancelled" || s === "canceled") return "bg-red-100 text-red-700";
  if (s === "rejected") return "bg-orange-100 text-orange-700";
  return "bg-yellow-100 text-yellow-700";
}

function renderReturn(rid, r) {
  const items = (r.items || []).map(it => `
    <div class="border rounded p-3 flex gap-3 items-center bg-white">
      <img src="${it.img || ''}" class="w-16 h-16 rounded object-cover border" alt="">
      <div>
        <div class="font-semibold">${it.name || ""}</div>
        <div class="text-sm text-gray-600">Qty: ${it.qty || 0}</div>
        <div class="text-sm text-gray-600">Price: Rs. ${it.price || 0}</div>
        <div class="text-sm text-gray-600">Product ID: ${it.id || ""}</div>
      </div>
    </div>
  `).join("");

  const div = document.createElement("div");
  div.className = "border rounded p-4 bg-gray-50";
  div.innerHTML = `
    <div class="flex justify-between items-start gap-3 flex-wrap">
      <div>
        <div class="font-bold text-lg">${r.name || ""}</div>
        <div class="text-sm text-gray-600">Return ID: ${rid}</div>
        <div class="text-sm text-gray-600">Order ID: ${r.orderId || ""}</div>
        <div class="text-sm text-gray-600">Phone: ${r.phone || ""}</div>
        <div class="text-sm text-gray-600">Email: ${r.email || ""}</div>
        <div class="text-sm text-gray-600">Address: <a class="text-blue-600 underline" target="_blank" href="${mapsLink(r.address || '')}">${r.address || ""}</a></div>
        <div class="text-sm text-gray-600">Type: ${r.type || "Return"}</div>
        <div class="text-sm text-gray-600">Reason: ${r.reason || ""}</div>
        <div class="text-sm text-gray-600">Status: <span class="px-2 py-1 rounded ${badge(r.status)}">${r.status || "Pending"}</span></div>
        <div class="text-sm text-gray-600">Created: ${r.createdAt || ""}</div>
        <div class="text-sm text-gray-600">Updated: ${r.updatedAt || ""}</div>
        <div class="text-sm mt-2 break-words">${r.details || ""}</div>
      </div>
    </div>
    <div class="mt-3 grid gap-2">${items}</div>
  `;
  document.getElementById("returnList").appendChild(div);
}

async function searchMyReturns() {
  const phone = document.getElementById("phoneInput").value.trim();
  const orderId = document.getElementById("orderIdInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value.trim().toLowerCase();
  const list = document.getElementById("returnList");
  list.innerHTML = "<div class='text-gray-500'>Searching...</div>";

  if (!phone) {
    list.innerHTML = "<div class='text-red-600'>Enter phone number</div>";
    return;
  }

  const snap = await db.ref("returns").orderByChild("phone").equalTo(phone).once("value");
  list.innerHTML = "";

  if (!snap.exists()) {
    list.innerHTML = "<div class='text-red-600'>No return found for this number</div>";
    return;
  }

  let found = false;
  snap.forEach(child => {
    const r = child.val() || {};
    const rid = child.key;
    const okOrder = orderId ? (r.orderId || "").toLowerCase().includes(orderId) : true;
    const okStatus = status ? (r.status || "").toLowerCase().includes(status) : true;
    if (okOrder && okStatus) {
      found = true;
      renderReturn(rid, r);
    }
  });

  if (!found) list.innerHTML = "<div class='text-red-600'>No matching return found</div>";
}
</script>
</body>
</html>
