<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Sidebar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Menu icon */
        .menu-icon {
            width: 40px;
            cursor: pointer;
            margin: 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }

        .bar {
            width: 80%;
            height: 4px;
            background-color: black;
            margin: 5px 0;
            transition: 0.4s;
        }

        /* Sidebar */
        .sidebar {
            height: 80%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            color: white;
            z-index: 1000;
            border: 1px solid white;
        }

        .sidebar a {
            padding: 10px 20px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<!-- Menu Icon -->
<div class="menu-icon" onclick="toggleMenu()">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- Sidebar Menu -->
<div id="sidebar" class="sidebar">
    <h2 style="padding-left: 20px;"> B.D.Joshi online shopping </h2>
    <nav>
        <ul style="list-style-type: none; padding: 0;">
         <li><a href="my shop.html"> back to B.D.Bajar </a></li>
>
        </ul>
    </nav>
</div>

<script>
    function toggleMenu() {
        var sidebar = document.getElementById("sidebar");
        var overlay = document.getElementById("overlay");

        if (sidebar.style.width === "250px") {
            sidebar.style.width = "0";
            overlay.style.display = "none";
        } else {
            sidebar.style.width = "250px";
            overlay.style.display = "block";
        }
    }

    function closeMenu() {
        document.getElementById("sidebar").style.width = "0";
        document.getElementById("overlay").style.display = "none";
    }
</script>

</body>
</html>


<!DOCTYPE html>

    <title>10 Photo Auto-Changing Slideshow</title>
    <style>
        /* Slideshow Container Styling */
        .slideshow-container {
            max-width: 20 px;
            position: relative;
            margin: 10;
        }

        /* Slide Images Styling */
        .slide {
            display: none;
            width: 50%;
            border-radius: 8px;
        }

        /* Fade Animation */
        .fade {
            animation: fadeEffect 1s;
        }

        /* Keyframes for Fade Effect */

        }

</head>

        <img src="https://i.ibb.co/sd42xXPL/file-PW2-YEY5-CXgb-Xg2gq-Mmp-Qk-V.webp" class="slide fade" alt="Image 4">

        <img src="https://i.ibb.co/CKnct4n3/file-1b2-MKz-N27-X2mmess-PK31d6.webp " class="slide fade" alt="Image 6">
        <img src="https://i.ibb.co/KQ6MNsf/file-DGUK7-Fc5-EAHSxu-JUA8mn-MX.webp" class="slide fade" alt="Image 7">
        <img src="https://i.ibb.co/hFQqZp7z/file-WGDXw-Rw-Kgwrtz6zu-Ku9n-Gu.webp" class="slide fade" alt="Image 8">
        <img src="https://i.ibb.co/fzpnNnbK/file-XDoh-W57g-HHD9u-HT7m-Ccyo9.webp" class="slide fade" alt="Image 9">
        <img src="https://i.ibb.co/hFQqZp7z/file-WGDXw-Rw-Kgwrtz6zu-Ku9n-Gu.webp" class="slide fade" alt="Image 10">
    </div>

    <!-- JavaScript for Auto-Changing Slideshow -->
    <script>
        let slideIndex = 0;

        function showSlides() {
            const slides = document.getElementsByClassName("slide");

            // Hide all slides
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }

            // Increment slide index
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1; }

            // Show current slide
            slides[slideIndex - 1].style.display = "block";

            // Change image every 3 seconds
            setTimeout(showSlides, 3000);
        }

        // Initialize slideshow
        showSlides();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Greeting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        /* Greeting top me rakhne ke liye */
        #greeting {
            font-size: 40px;
            font-weight: bold;
            color: black;         /* Black color */
            text-align: center;
            padding-top: 30px;    /* Upar halka space */
            padding-bottom: 40px; /* Neeche zyada space */
        }
    </style>
</head>

<body>

    <div id="greeting"></div>

    <script>
        function updateGreeting() {
            const now = new Date();
            const hour = now.getHours();
            let greeting = "";

            if (hour >= 5 && hour < 12) {
                greeting = "Good Morning 🌞";
            } else if (hour >= 12 && hour < 16) {
                greeting = "Good Afternoon 😊";
            } else if (hour >= 16 && hour < 20) {
                greeting = "Good Evening 🌆";
            } else {
                greeting = "Good Night 🌙";
            }

            document.getElementById("greeting").innerHTML = greeting;
        }

        updateGreeting();
    </script>

</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders - B.D.Bajar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-blue-600 text-white py-4 shadow-md">
    <h1 class="text-2xl font-bold text-center">📦 My Orders - B.D.Bajar</h1>
  </header>

  <!-- Input Phone -->
  <div class="max-w-md mx-auto mt-8 px-4">
    <input type="text" id="phoneInput" placeholder="Enter your phone number"
      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
    <button onclick="fetchMyOrders()" 
      class="mt-4 w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
      Show My Orders
    </button>
  </div>

  <!-- Orders Cards -->
  <div id="ordersContainer" class="max-w-4xl mx-auto mt-8 grid gap-6 px-4 md:grid-cols-2 lg:grid-cols-3"></div>

  <script>
    // ===== Firebase Config with YOUR Realtime DB URL =====
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "order-save-66986.firebaseapp.com",
      databaseURL: "https://order-save-66986-default-rtdb.firebaseio.com",
      projectId: "order-save-66986",
      storageBucket: "order-save-66986.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    // ✅ NEW: Phone auto-fill from profile
const savedProfile = JSON.parse(localStorage.getItem("profile"));

if (savedProfile && savedProfile.contact) {
  document.getElementById("phoneInput").value = savedProfile.contact;
}

    const db = firebase.database();

    function getStatusColor(status) {
      switch ((status || "").toLowerCase()) {
        case "delivered": return "bg-green-100 text-green-700";
        case "cancelled": return "bg-red-100 text-red-700";
        case "confirmed": return "bg-blue-100 text-blue-700";
        default: return "bg-yellow-100 text-yellow-700"; // pending or others
      }
    }

    function fetchMyOrders() {
      const phone = document.getElementById("phoneInput").value.trim();
      const container = document.getElementById("ordersContainer");
      container.innerHTML = "";

      if (!phone) {
        alert("Please enter your phone number");
        return;
      }

      db.ref("orders").orderByChild("customer/phone").equalTo(phone).once("value", snapshot => {
        if (!snapshot.exists()) {
          container.innerHTML = `<p class="text-center text-gray-600 col-span-full">No orders found for this number.</p>`;
          return;
        }

        snapshot.forEach(orderSnap => {
          const order = orderSnap.val();
          const status = order.paymentStatus || order.status || "Pending";
          const statusClass = getStatusColor(status);

          // Build items HTML
          let itemsHtml = "";
          if (order.items && Array.isArray(order.items)) {
            order.items.forEach(it => {
              itemsHtml += `
                <div class="flex items-center gap-2 mb-1">
                  <img src="${it.img || ''}" class="w-12 h-12 object-cover rounded" alt="${it.name}">
                  <div class="text-left">
                    <div class="font-semibold">${it.qty} × ${it.name}</div>
                    <div class="text-sm text-gray-600">Size: ${it.size}</div>
                  </div>
                </div>
              `;
            });
          }

          const mapLink = order.customer && order.customer.address ?
            `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.customer.address)}` :
            "#";

          const card = document.createElement("div");
          card.className = "bg-white shadow-lg rounded-lg p-5 border";
          card.innerHTML = `
  <h2 class="text-lg font-bold mb-2 truncate">Order ID: ${orderSnap.key}</h2>
  <div class="text-sm text-gray-700 mb-2"><b>Name:</b> ${order.customer.name || ""}</div>
  <div class="text-sm text-gray-700 mb-2"><b>Phone:</b> ${order.customer.phone || ""}</div>

  ${order.customer.profile ? `
    <div class="mt-2 text-sm bg-gray-50 p-2 rounded">
      <div><b>Profile Details:</b></div>
      <div>Email: ${order.customer.profile.email || ""}</div>
      <div>Gender: ${order.customer.profile.gender || ""}</div>
    </div>
  ` : ''}

  <div class="mb-2">${itemsHtml}</div>
  <div class="text-sm text-gray-700 mb-2"><b>Payment:</b> ${order.paymentMethod || ""}</div>
  <span class="inline-block px-3 py-1 mt-2 text-sm font-semibold rounded-full ${statusClass}">
    ${status}
  </span>
  <div class="mt-3 text-sm"><b>Delivery Address:</b><br>
    <a href="${mapLink}" target="_blank" class="text-blue-600 underline">
      ${order.customer.address || ""}
    </a>
  </div>
`;

          container.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
